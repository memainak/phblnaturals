<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | PHBL Naturals</title>
<meta name="description" content="Reach PHBL Naturals customer care on WhatsApp, phone or email, or send us a message using the contact form.">
<link rel="canonical" href="https://phblnaturals.com/contact.html">
<meta name="theme-color" content="#2F5D3A">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=1.0.9">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<div id="announce" class="announce" aria-label="Offers"></div>
<header class="header" id="site-header"></header>

<main id="main">
  <div class="wrap section">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Contact</span></nav>
    <h1>Contact us</h1>
    <div class="checkout" style="margin-top:20px">
      <div>
        <form class="panel" id="contact-form" novalidate>
          <h2 style="font-size:16px">Send us a message</h2>
          <div class="two-col">
            <div class="field"><label for="name">Your name *</label><input id="name" name="name" required></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" inputmode="numeric" maxlength="10"></div>
          </div>
          <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
          <div class="field"><label for="subject">Subject</label><input id="subject" name="subject"></div>
          <div class="field"><label for="message">Message *</label><textarea id="message" name="message" required></textarea></div>
          <button class="btn btn--block" type="submit">Send message</button>
          <div id="contact-message" style="margin-top:12px"></div>
        </form>
      </div>
      <aside>
        <div style="display:grid;gap:10px" id="contact-info"></div>
        <div class="panel" style="margin-top:16px">
          <h2 style="font-size:15px">Customer care hours</h2>
          <p class="muted" id="contact-hours"></p>
          <h2 style="font-size:15px;margin-top:16px">Registered address</h2>
          <p class="muted" style="white-space:pre-line" id="contact-address"></p>
          <p class="muted" style="font-size:12px">For complaints, see our <a href="pages/grievance.html">Grievance Officer</a> page.</p>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/app.js?v=1.0.9"></script>
<script src="assets/js/pages.js?v=1.0.9"></script>
</body>
</html>
